name: Sync customer repos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "artifacts/qms360/**"
      - "artifacts/api-server/**"
      - "lib/**"
      - "patches/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - ".github/workflows/sync-customer-repos.yml"

permissions:
  contents: read

concurrency:
  group: customer-repo-sync
  cancel-in-progress: false

env:
  TARGET_BRANCH: vendor-sync
  FRONTEND_REPO: ${{ vars.CUSTOMER_FRONTEND_REPO }}
  BACKEND_REPO: ${{ vars.CUSTOMER_BACKEND_REPO }}

jobs:
  sync:
    # Push sync is opt-in. Manual runs are restricted to the source main branch.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.CUSTOMER_SYNC_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate destinations
        env:
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for repo in "$FRONTEND_REPO" "$BACKEND_REPO"; do
            [[ "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::Configure CUSTOMER_FRONTEND_REPO and CUSTOMER_BACKEND_REPO as owner/repository."; exit 1; }
            [[ "${repo,,}" != "${SOURCE_REPO,,}" ]] || { echo "::error::A destination cannot be the source repository."; exit 1; }
          done
          [[ "${FRONTEND_REPO,,}" != "${BACKEND_REPO,,}" ]] || { echo "::error::Frontend and backend must use different repositories."; exit 1; }

      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test export and ownership safeguards
        run: node --test source/scripts/customer-repos/customer-repos.test.mjs

      - name: Export both applications
        run: |
          node source/scripts/customer-repos/export.mjs frontend "$RUNNER_TEMP/customer-frontend"
          node source/scripts/customer-repos/export.mjs backend "$RUNNER_TEMP/customer-backend"

      # Both exports must install and build before any customer token is used.
      - name: Validate frontend export
        working-directory: ${{ runner.temp }}/customer-frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Validate backend export
        working-directory: ${{ runner.temp }}/customer-backend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Check customer credential is configured
        env:
          CUSTOMER_TOKEN: ${{ secrets.CUSTOMER_REPO_TOKEN }}
        run: |
          test -n "$CUSTOMER_TOKEN" || { echo "::error::Configure the CUSTOMER_REPO_TOKEN Actions secret."; exit 1; }

      - name: Check out customer frontend review branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FRONTEND_REPO }}
          token: ${{ secrets.CUSTOMER_REPO_TOKEN }}
          ref: ${{ env.TARGET_BRANCH }}
          path: customer-frontend

      - name: Check out customer backend review branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKEND_REPO }}
          token: ${{ secrets.CUSTOMER_REPO_TOKEN }}
          ref: ${{ env.TARGET_BRANCH }}
          path: customer-backend

      - name: Apply both exports without deleting customer-owned files
        run: |
          node source/scripts/customer-repos/sync.mjs "$RUNNER_TEMP/customer-frontend" customer-frontend
          node source/scripts/customer-repos/sync.mjs "$RUNNER_TEMP/customer-backend" customer-backend

      - name: Commit and push review branches
        run: |
          set -euo pipefail
          for directory in customer-frontend customer-backend; do
            (
              cd "$directory"
              git config user.name "qms360-sync"
              git config user.email "qms360-sync@users.noreply.github.com"
              if git diff --cached --quiet; then
                echo "$directory: no changes"
              else
                git commit -m "Sync QMS360 source ${GITHUB_SHA:0:12}"
                git push origin "HEAD:${TARGET_BRANCH}"
              fi
            )
          done
