# Template only -- copy to qms360-secret.yaml (git-ignored), fill in real
# values, then `kubectl apply -f deploy/k8s/qms360-secret.yaml`. Never commit
# the filled-in file.
apiVersion: v1
kind: Secret
metadata:
  name: qms360-secret
  namespace: codefactory
type: Opaque
stringData:
  # RDS has SSL enforced -- the ?sslmode=no-verify query param is required
  # (maps to `ssl: { rejectUnauthorized: false }` via pg's connection-string
  # parser, same as the existing EC2 deploy's DB_SSL=no-verify). Omitting it
  # produces: "no pg_hba.conf entry for host ..., no encryption" at startup.
  DATABASE_URL: "postgresql://user:password@host:5432/dbname?sslmode=no-verify"
  JWT_SECRET: "change-me-to-a-long-random-value"
  SESSION_SECRET: "change-me-to-a-different-long-random-value"
  # S3 access -- the AWS SDK's default credential chain picks these up
  # automatically (no code change needed). Same key/secret used elsewhere
  # for S3 uploads; needs s3:GetObject/PutObject/DeleteObject on
  # dronahq-app-prod-mumbai.
  AWS_ACCESS_KEY_ID: "change-me"
  AWS_SECRET_ACCESS_KEY: "change-me"
  # Optional -- only needed if the AI integrations feature is enabled.
  # AI_INTEGRATIONS_ANTHROPIC_API_KEY: ""
