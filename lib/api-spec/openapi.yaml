openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: QMS360 Phase 1 foundation API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Local and container authentication
  - name: platform
    description: Shared platform context
  - name: master-data
    description: Organization-wide master data
  - name: apps
    description: Distinct QMS360 application overviews
  - name: executive
    description: Cross-application executive view
  - name: integrations
    description: Shared integration and data-sync cockpit
  - name: qaqc
    description: QA/QC and document governance workspace
  - name: qaqc-admin
    description: QA/QC workspace administration
  - name: lessons
    description: Lesson Learned workspace
  - name: lessons-admin
    description: Lesson Learned workspace administration
  - name: audit
    description: QMS Audit workspace
  - name: audit-admin
    description: QMS Audit workspace administration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with local credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a local development user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already registered
  /auth/config:
    get:
      operationId: getAuthConfiguration
      tags: [auth]
      summary: Public authentication mode and activation status
      responses:
        "200":
          description: Authentication configuration without secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationConfiguration"
  /auth/drona:
    post:
      operationId: dronaSignIn
      tags: [auth]
      summary: Exchange a DronaHQ session proof
      description: Disabled until Drona backend verification and access-policy acceptance are implemented. A profile or client-side nonce check alone never issues a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DronaSessionInput"
      responses:
        "200":
          description: Verified and authorized session after activation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid identity or proof shape
        "409":
          description: Drona authentication mode is not selected
        "503":
          description: Backend verification or access policy is not ready
  /auth/sso:
    post:
      operationId: containerSso
      tags: [auth]
      summary: Stub container profile handoff
      description: Accepts the future Algihaz DronaHQ profile shape and issues the standard QMS360 JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerSsoInput"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "501":
          description: Container strategy is not enabled
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Authentication required
  /auth/change-password:
    put:
      operationId: changePassword
      tags: [auth]
      summary: Change the current user's password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeInput"
      responses:
        "200":
          description: Updated user context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Authentication required
        "422":
          description: Invalid password
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204": { description: Session ended }
  /platform/context:
    get:
      operationId: getPlatformContext
      tags: [platform]
      summary: Get shared platform context
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Platform context including apps and projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformContext"
  /projects:
    get:
      operationId: listProjects
      tags: [platform]
      summary: List active projects
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
  /platform/projects:
    get:
      operationId: listPlatformProjects
      tags: [platform]
      summary: List shared projects
      parameters: [{$ref: "#/components/parameters/Page"}, {$ref: "#/components/parameters/Limit"}]
      responses:
        "200": {$ref: "#/components/responses/ProjectPage"}
  /platform/business-units:
    get:
      operationId: listBusinessUnits
      tags: [platform]
      summary: List shared business units
      parameters: [{$ref: "#/components/parameters/Page"}, {$ref: "#/components/parameters/Limit"}]
      responses:
        "200": {$ref: "#/components/responses/BusinessUnitPage"}
  /integrations/project-master:
    get:
      operationId: listDronaProjectMaster
      tags: [integrations]
      summary: Read transferred Drona projects within existing administrator project scope
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/Limit"}
        - name: search
          in: query
          schema: {type: string, maxLength: 120}
      responses:
        "200":
          description: Saved QMS project records and existing Drona link details
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, limit, linkMetadataAvailable]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/DronaProjectMasterRecord"}}
                  total: {type: number}
                  page: {type: number}
                  limit: {type: number}
                  linkMetadataAvailable: {type: boolean}
        "403": {description: Administrator access required}
  /integrations/project-master/{projectId}/cost-centre:
    patch:
      operationId: updateDronaProjectCostCentre
      tags: [integrations]
      summary: Set or clear only the QMS cost center of a saved Drona project
      security: [{bearerAuth: []}]
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectCostCentreInput"}
      responses:
        "200":
          description: Saved cost center
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectCostCentreResult"}
        "400": {description: Invalid project or cost center}
        "401": {description: Authentication required}
        "403": {description: Administrator access required}
        "404": {description: Project not available within current project access}
  /platform/application-access:
    get:
      operationId: getApplicationAccess
      tags: [platform]
      summary: Get current user's application access flags
      responses:
        "200": {description: Application access, content: {application/json: {schema: {$ref: "#/components/schemas/ApplicationAccess"}}}}
  /platform/users/{userId}/temporary-password:
    put:
      operationId: setUserTemporaryPassword
      tags: [platform]
      summary: Set or replace a user's sign-in password
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/UserId"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/TemporaryPasswordInput"}}}}
      responses:
        "204": {description: Sign-in password set}
        "403": {description: Administrator access required}
        "404": {description: User not found}
  /platform/users/{userId}/email:
    put:
      operationId: updateUserEmail
      tags: [platform]
      summary: Change a user's sign-in email address
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/UserId"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/UserEmailUpdate"}}}}
      responses:
        "200": {description: Email updated, content: {application/json: {schema: {$ref: "#/components/schemas/UserEmailUpdateResult"}}}}
        "403": {description: Administrator access required}
        "404": {description: User not found}
        "409": {description: Email is already used by another user}
        "422": {description: Invalid email address}
  /platform/roles:
    get:
      operationId: listPlatformRoles
      tags: [platform]
      summary: List assignable platform roles
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Active platform roles for the organization
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/PlatformRole"}
        "403": {description: Platform administrator access required}
  /platform/users/{userId}/role:
    put:
      operationId: updateUserPlatformRole
      tags: [platform]
      summary: Change a user's platform role
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/UserId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlatformRoleUpdate"}
      responses:
        "200":
          description: Platform role updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlatformRoleUpdateResult"}
        "403": {description: Platform administrator access required}
        "404": {description: User or role not found}
        "409": {description: Role change would remove the last organization administrator}
        "422": {description: Invalid role assignment}
  /platform/field-settings:
    get:
      operationId: getFieldSettings
      tags: [platform]
      summary: Get the configurable field catalog per module with current editable/read-only access
      responses:
        "200": {description: Field settings catalog, content: {application/json: {schema: {$ref: "#/components/schemas/FieldSettingsCatalog"}}}}
    put:
      operationId: updateFieldSettings
      tags: [platform]
      summary: Save field access settings (administrator only); upserts each provided entry
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/FieldSettingsUpdate"}}}}
      responses:
        "200": {description: Updated catalog, content: {application/json: {schema: {$ref: "#/components/schemas/FieldSettingsCatalog"}}}}
        "403": {description: Administrator access required}
        "422": {description: "Unknown module, form or field key"}
  /platform/reference-data:
    get:
      operationId: getPlatformReferenceData
      tags: [platform]
      summary: Get cacheable shared reference data snapshot
      parameters: [{$ref: "#/components/parameters/Since"}]
      responses:
        "200": {description: Reference data snapshot, content: {application/json: {schema: {$ref: "#/components/schemas/ReferenceDataSnapshot"}}}}
  /platform/numbering:
    get: {operationId: getNumberingConfig, tags: [platform], summary: Get per-module reference numbering patterns with next-number previews, responses: {"200": {description: Numbering config, content: {application/json: {schema: {$ref: "#/components/schemas/NumberingConfig"}}}}}}
  /platform/numbering/{module}:
    put:
      operationId: updateNumberingPattern
      tags: [platform]
      summary: Save a module reference numbering pattern (admin)
      parameters: [{name: module, in: path, required: true, schema: {type: string, enum: [qaqc, lessons, audit]}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/NumberingPatternInput"}}}}
      responses: {"200": {description: Saved pattern, content: {application/json: {schema: {$ref: "#/components/schemas/NumberingModuleConfig"}}}}}
    delete:
      operationId: resetNumberingPattern
      tags: [platform]
      summary: Reset a module numbering pattern to the default (admin)
      parameters: [{name: module, in: path, required: true, schema: {type: string, enum: [qaqc, lessons, audit]}}]
      responses: {"200": {description: Reset pattern, content: {application/json: {schema: {$ref: "#/components/schemas/NumberingModuleConfig"}}}}}
  /platform/organization-settings:
    get:
      operationId: getOrganizationSettings
      tags: [platform]
      summary: Get organization settings
      responses:
        "200": {description: Organization settings, content: {application/json: {schema: {$ref: "#/components/schemas/OrganizationSettings"}}}}
    put:
      operationId: updateOrganizationSettings
      tags: [platform]
      summary: Update organization settings
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/OrganizationSettings"}}}}
      responses:
        "200": {description: Updated settings, content: {application/json: {schema: {$ref: "#/components/schemas/OrganizationSettings"}}}}
  /platform/master-data:
    get:
      operationId: listMasterData
      tags: [master-data]
      summary: List all master data groups and values
      responses:
        "200": {description: Master data, content: {application/json: {schema: {$ref: "#/components/schemas/MasterDataGroupList"}}}}
  /platform/master-data/roles:
    get:
      operationId: listMasterDataRoles
      tags: [Platform]
      summary: List organization application roles for Master Data assignments
      responses:
        "200":
          description: Active and inactive application roles, without permission changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterDataRoleOptions"
  /platform/master-data/lov/{code}:
    get:
      operationId: getMasterDataLov
      tags: [master-data]
      summary: Get active values for a master data code
      parameters:
        - name: code
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {description: List of values, content: {application/json: {schema: {$ref: "#/components/schemas/MasterDataLov"}}}}
        "404": {description: Group not found, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /platform/master-data/groups:
    post:
      operationId: createMasterDataGroup
      tags: [master-data]
      summary: Create a master data group
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateMasterDataGroupInput"}}}}
      responses:
        "201": {description: Created group, content: {application/json: {schema: {$ref: "#/components/schemas/MasterDataGroup"}}}}
        "409": {description: Code already exists, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /platform/master-data/groups/{id}:
    put:
      operationId: updateMasterDataGroup
      tags: [master-data]
      summary: Update a master data group
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/UpdateMasterDataGroupInput"}}}}
      responses:
        "200": {description: Updated group, content: {application/json: {schema: {$ref: "#/components/schemas/MasterDataGroup"}}}}
    delete:
      operationId: deleteMasterDataGroup
      tags: [master-data]
      summary: Soft-delete a master data group
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "204": {description: Soft-deleted}
        "409": {description: System groups cannot be deleted, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /platform/master-data/groups/{groupId}/values:
    post:
      operationId: createMasterDataValue
      tags: [master-data]
      summary: Add a value to a master data group
      parameters:
        - name: groupId
          in: path
          required: true
          schema: {type: string}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateMasterDataValueInput"}}}}
      responses:
        "201": {description: Created value, content: {application/json: {schema: {$ref: "#/components/schemas/MasterDataValue"}}}}
  /platform/master-data/values/{id}:
    put:
      operationId: updateMasterDataValue
      tags: [master-data]
      summary: Update a master data value
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/UpdateMasterDataValueInput"}}}}
      responses:
        "200": {description: Updated value, content: {application/json: {schema: {$ref: "#/components/schemas/MasterDataValue"}}}}
    delete:
      operationId: deleteMasterDataValue
      tags: [master-data]
      summary: Soft-delete a master data value
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "204": {description: Soft-deleted}
  /integrations/connectors:
    get:
      operationId: listIntegrationConnectors
      tags: [integrations]
      summary: List integration connectors
      parameters: [{$ref: "#/components/parameters/Page"}, {$ref: "#/components/parameters/Limit"}]
      responses:
        "200": {$ref: "#/components/responses/IntegrationConnectorPage"}
    post:
      operationId: createIntegrationConnector
      tags: [integrations]
      summary: Create an integration connector (admin only)
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/IntegrationConnectorCreateInput"}}}}
      responses:
        "201": {description: Created connector, content: {application/json: {schema: {$ref: "#/components/schemas/IntegrationConnector"}}}}
        "403": {description: Administrator access required}
  /integrations/connectors/{id}:
    put:
      operationId: updateIntegrationConnector
      tags: [integrations]
      summary: Update connector configuration or status
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/IntegrationConnector"}}}}
      responses:
        "200": {description: Updated connector, content: {application/json: {schema: {$ref: "#/components/schemas/IntegrationConnector"}}}}
    delete:
      operationId: deleteIntegrationConnector
      tags: [integrations]
      summary: Delete a connector (admin only)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "204": {description: Deleted}
        "403": {description: Administrator access required}
  /integrations/connectors/{id}/test:
    post:
      operationId: testConnectorConnection
      tags: [integrations]
      summary: Test a source-system connector connection (admin only)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Connection test result, content: {application/json: {schema: {$ref: "#/components/schemas/ConnectorConnectionTestResult"}}}}
  /integrations/connectors/{id}/pull:
    post:
      operationId: pullConnectorData
      tags: [integrations]
      summary: Pull project or user data from a source connector now (admin only)
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PullConnectorBody"}}}}
      responses:
        "200": {description: Pull result, content: {application/json: {schema: {$ref: "#/components/schemas/PullResult"}}}}
  /integrations/import-templates:
    get:
      operationId: listImportTemplates
      tags: [integrations]
      summary: List Excel import templates, seeding the defaults on first use
      parameters: [{name: entity, in: query, schema: {type: string, enum: [projects, users]}}]
      responses:
        "200": {description: Import templates, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/ImportTemplate"}}}}}
    post:
      operationId: createImportTemplate
      tags: [integrations]
      summary: Create an import template (admin only)
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ImportTemplateInput"}}}}
      responses:
        "201": {description: Created template, content: {application/json: {schema: {$ref: "#/components/schemas/ImportTemplate"}}}}
  /integrations/import-templates/{id}:
    put:
      operationId: updateImportTemplate
      tags: [integrations]
      summary: Update a non-default import template (admin only)
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ImportTemplateInput"}}}}
      responses:
        "200": {description: Updated template, content: {application/json: {schema: {$ref: "#/components/schemas/ImportTemplate"}}}}
    delete:
      operationId: deleteImportTemplate
      tags: [integrations]
      summary: Delete a non-default import template (admin only)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "204": {description: Deleted}
  /integrations/import-templates/{id}/download:
    get:
      operationId: downloadImportTemplate
      tags: [integrations]
      summary: Download an Excel template file as base64
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Template file, content: {application/json: {schema: {$ref: "#/components/schemas/ImportTemplateDownload"}}}}
  /integrations/connectors/{id}/test-email:
    post:
      operationId: sendConnectorTestEmail
      tags: [integrations]
      summary: Send a test email to the requesting admin through an email connector
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Test email sent, content: {application/json: {schema: {type: object, required: [sent, message], properties: {sent: {type: boolean}, message: {type: string}}}}}}}
  /integrations/connectors/{id}/field-mappings:
    get:
      operationId: getConnectorFieldMappings
      tags: [integrations]
      summary: Get the field-mapping workspace for a connector
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Field-mapping workspace, content: {application/json: {schema: {$ref: "#/components/schemas/FieldMappingWorkspace"}}}}
        "404": {description: Connector not found}
        "422": {description: Connector does not support field mapping}
    put:
      operationId: saveConnectorFieldMappings
      tags: [integrations]
      summary: Replace and activate field mappings for one entity (admin only)
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {$ref: "#/components/requestBodies/SaveFieldMappings"}
      responses:
        "200": {description: Saved field-mapping workspace, content: {application/json: {schema: {$ref: "#/components/schemas/FieldMappingWorkspace"}}}}
        "403": {description: Administrator access required}
        "404": {description: Connector not found}
        "422": {description: Mapping validation failed}
  /integrations/sync-jobs:
    get:
      operationId: listSyncJobs
      tags: [integrations]
      summary: List data sync jobs
      parameters: [{$ref: "#/components/parameters/Page"}, {$ref: "#/components/parameters/Limit"}]
      responses:
        "200": {$ref: "#/components/responses/SyncJobPage"}
  /integrations/sync-jobs/{id}/retry:
    post:
      operationId: retrySyncJob
      tags: [integrations]
      summary: Retry a failed sync job
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "202": {description: Retry queued, content: {application/json: {schema: {$ref: "#/components/schemas/SyncJob"}}}}
  /integrations/email-settings:
    get:
      operationId: getEmailDeliverySettings
      tags: [integrations]
      summary: Get QMS360 email retention and retry policy (Super Admin only)
      responses:
        "200": {description: Email delivery settings, content: {application/json: {schema: {$ref: "#/components/schemas/EmailDeliverySettings"}}}}
        "403": {description: Super Admin access required}
    put:
      operationId: updateEmailDeliverySettings
      tags: [integrations]
      summary: Update QMS360 email retention and retry policy (Super Admin only)
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/EmailDeliverySettings"}}}}
      responses:
        "200": {description: Updated email delivery settings, content: {application/json: {schema: {$ref: "#/components/schemas/EmailDeliverySettings"}}}}
        "403": {description: Super Admin access required}
        "422": {description: Invalid settings}
  /integrations/email-queue:
    get:
      operationId: listOutboundEmails
      tags: [integrations]
      summary: Monitor the tenant outbound email queue (Super Admin only)
      parameters:
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/Limit"}
        - {name: status, in: query, schema: {type: string, enum: [all, queued, sending, retrying, sent, failed]}}
        - {name: app, in: query, schema: {type: string, enum: [all, qaqc, lessons, audit, platform]}}
        - {name: search, in: query, schema: {type: string}}
      responses:
        "200": {$ref: "#/components/responses/OutboundEmailPage"}
        "403": {description: Super Admin access required}
  /integrations/email-queue/{id}/retry:
    post:
      operationId: retryOutboundEmail
      tags: [integrations]
      summary: Queue one failed email for another delivery attempt (Super Admin only)
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "202": {description: Email queued, content: {application/json: {schema: {$ref: "#/components/schemas/OutboundEmail"}}}}
        "403": {description: Super Admin access required}
        "404": {description: Email not found}
        "409": {description: Email is not failed}
  /integrations/health:
    get:
