        version: {type: string}
        reportType: {type: string, enum: [monthly, daily, csat]}
        kind: {type: string, enum: [report, dashboard]}
        state: {type: string, enum: [draft, published, archived]}
        isDefault: {type: boolean}
        fileName: {type: string}
        uploaded: {type: boolean}
