  schemas:
    AuthenticationConfiguration:
      type: object
      required: [mode, localLoginAllowed, dronaReady, blockers]
      properties:
        mode:
          type: string
          enum: [local, container, drona, disabled]
        localLoginAllowed:
          type: boolean
        dronaReady:
          type: boolean
        dronaEmailException:
          type: boolean
          description: Explicitly approved email-only login; Drona session and nonce are not verified.
        blockers:
          type: array
          items:
            type: string
    DronaSessionInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
          maxLength: 255
        uid:
          type: string
          pattern: '^[1-9][0-9]*$'
          maxLength: 19
        nonce:
          type: string
          minLength: 1
          maxLength: 4096
