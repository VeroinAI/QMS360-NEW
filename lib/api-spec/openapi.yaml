      type: object
      required: [source]
      properties:
        source: {type: string, minLength: 1, maxLength: 200}
        pdfField: {type: string, maxLength: 200}
        page: {type: number, minimum: 1, maximum: 40}
        x: {type: number, minimum: 0}
        y: {type: number, minimum: 0}
        width: {type: number, exclusiveMinimum: 0}
        height: {type: number, exclusiveMinimum: 0}
        fontSize: {type: number, minimum: 6, maximum: 36}
    QaqcPdfTemplate:
      type: object
      required: [id, name, version, reportType, kind, state, isDefault, fileName, uploaded, pages, fields, mappings]
