components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SowReportType: {name: reportType, in: query, schema: {type: string, enum: [monthly, daily, csat]}}
    SowPeriod: {name: period, in: query, schema: {type: string, description: "Reporting date YYYY-MM-DD; monthly reports use the first day of the month"}}
    AppKey:
      name: appKey
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AppKey"
    Id: {name: id, in: path, required: true, schema: {type: string}}
    UserId: {name: userId, in: path, required: true, schema: {type: string}}
    EntityId: {name: entityId, in: query, required: false, schema: {type: string}}
    SessionId: {name: sessionId, in: path, required: true, schema: {type: string}}
    Page: {name: page, in: query, schema: {type: number, minimum: 1, default: 1}}
    Limit: {name: limit, in: query, schema: {type: number, minimum: 1, maximum: 200, default: 20}}
    Since: {name: since, in: query, required: false, schema: {type: string, format: date-time}}
    ProjectId: {name: projectId, in: query, required: false, schema: {type: string}}
    Period: {name: period, in: query, required: false, schema: {type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"}}
    From: {name: from, in: query, schema: {type: string, format: date}}
    To: {name: to, in: query, schema: {type: string, format: date}}
    ActorId: {name: actorId, in: query, schema: {type: string}}
    Action: {name: action, in: query, schema: {type: string}}
    RecordType: {name: recordType, in: query, required: true, schema: {type: string}}
    RecordId: {name: recordId, in: query, required: true, schema: {type: string}}
    SpreadsheetFormat: {name: format, in: query, required: true, schema: {type: string, enum: [csv, xlsx]}}
    ReportFormat: {name: format, in: query, required: false, schema: {type: string, enum: [json, pdf, csv, xlsx]}}
  responses:
    ReportFile:
      description: Generated report file
      content:
        application/json: {schema: {$ref: "#/components/schemas/ReportDelivery"}}
    ProjectPage: {description: Paginated projects, content: {application/json: {schema: {$ref: "#/components/schemas/ProjectPage"}}}}
    BusinessUnitPage: {description: Paginated business units, content: {application/json: {schema: {$ref: "#/components/schemas/BusinessUnitPage"}}}}
    IntegrationConnectorPage: {description: Paginated connectors, content: {application/json: {schema: {$ref: "#/components/schemas/IntegrationConnectorPage"}}}}
    SyncJobPage: {description: Paginated jobs, content: {application/json: {schema: {$ref: "#/components/schemas/SyncJobPage"}}}}
    OutboundEmailPage: {description: Paginated outbound emails, content: {application/json: {schema: {$ref: "#/components/schemas/OutboundEmailPage"}}}}
    ExecutiveSummaryPage: {description: Paginated summaries, content: {application/json: {schema: {$ref: "#/components/schemas/ExecutiveSummaryPage"}}}}
    ReferenceItemPage: {description: Paginated reference items, content: {application/json: {schema: {$ref: "#/components/schemas/ReferenceItemPage"}}}}
    QAQCMetricPage: {description: Paginated metrics, content: {application/json: {schema: {$ref: "#/components/schemas/QAQCMetricPage"}}}}
    MaterialInspectionPage: {description: Paginated inspections, content: {application/json: {schema: {$ref: "#/components/schemas/MaterialInspectionPage"}}}}
    QtbtPage: {description: Paginated talks, content: {application/json: {schema: {$ref: "#/components/schemas/QTBTPage"}}}}
    CustomerSatisfactionPage: {description: Paginated surveys, content: {application/json: {schema: {$ref: "#/components/schemas/CustomerSatisfactionPage"}}}}
    DocumentGovernancePage: {description: Paginated log, content: {application/json: {schema: {$ref: "#/components/schemas/DocumentGovernancePage"}}}}
    QualityBriefPage: {description: Paginated briefs, content: {application/json: {schema: {$ref: "#/components/schemas/QualityBriefPage"}}}}
    ApprovalItemPage: {description: Paginated approvals, content: {application/json: {schema: {$ref: "#/components/schemas/ApprovalItemPage"}}}}
    EvidencePage: {description: Paginated evidence, content: {application/json: {schema: {$ref: "#/components/schemas/EvidencePage"}}}}
    RolePage: {description: Paginated roles, content: {application/json: {schema: {$ref: "#/components/schemas/RolePage"}}}}
